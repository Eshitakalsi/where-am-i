[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "where-am-i"
version = "0.1.0"
description = "MCP server that reconstructs your current dev session context"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
where-am-i = "where_am_i.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/where_am_i"]
